<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>FXSMP | Entrar</title>
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <header class="navbar">
        <img src="FXSMP.png" alt="logo" class="logo">
        <nav class="nav-btns">
            <a href="index.html" class="nav-btn">Home</a>
            <a href="form.html" class="nav-btn">Form</a>
            <a href="disc.html" class="nav-btn">Comunidade</a>
            <a href="Staff.html" class="nav-btn">Staff</a>
        </nav>
    </header>

    <main class="page centro">
        <form class="card" id="f">
            <h1>Área da Staff</h1>
            <p class="sub">Entre para personalizar o seu perfil.</p>
            <label for="usuario">Usuário</label>
            <input type="text" id="usuario" name="usuario" autocomplete="username" autocapitalize="none" spellcheck="false" autofocus required>
            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" autocomplete="current-password" required>
            <button type="submit" class="btn-p" id="entrar">Entrar</button>
            <div class="erro" id="erro" role="alert" aria-live="polite"></div>
            <a href="index.html" class="voltar">← Voltar para a Home</a>
        </form>
    </main>
    <script src="js/api.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
