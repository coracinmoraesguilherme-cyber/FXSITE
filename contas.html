<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>FXSMP | Contas da Staff</title>
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <header class="navbar">
        <img src="FXSMP.png" alt="logo" class="logo">
        <nav class="nav-btns">
            <a href="index.html" class="nav-btn">Home</a>
            <a href="form.html" class="nav-btn">Form</a>
            <a href="disc.html" class="nav-btn">Comunidade</a>
            <a href="Staff.html" class="nav-btn">Staff</a>
        </nav>
    </header>

    <main class="page">
        <section class="card largo">
            <h1>Contas da Staff</h1>
            <p class="sub">Somente a conta primária vê esta página. A senha provisória é gerada pelo sistema, aparece uma única vez e precisa ser trocada no primeiro login.</p>
            <h2>Nova conta</h2>
            <form class="novo" id="f">
                <div><label for="usuario">Usuário (a-z, 0-9, _ . -)</label><input type="text" id="usuario" autocomplete="off" autocapitalize="none" spellcheck="false" required></div>
                <div><label for="nome">Nome no perfil</label><input type="text" id="nome" autocomplete="off" maxlength="40" required></div>
                <button type="submit" class="btn-p" id="criar">Criar conta</button>
            </form>
            <div class="erro" id="erro" role="alert" aria-live="polite"></div>
            <div id="senhabox" class="senhabox" hidden></div>
            <h2>Contas existentes</h2>
            <table class="tab"><thead><tr><th>Usuário</th><th>Nome</th><th>Situação</th><th>Ações</th></tr></thead><tbody id="lista"></tbody></table>
            <a href="painel.html" class="voltar">← Voltar ao painel</a>
        </section>
    </main>
    <script src="js/api.js"></script>
    <script src="js/contas.js"></script>
</body>
</html>
