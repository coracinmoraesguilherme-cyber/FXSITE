<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self' https:; frame-src https://open.spotify.com https://www.youtube.com https://www.youtube-nocookie.com; connect-src 'self' https://*.supabase.co; base-uri 'none'; form-action 'self'; object-src 'none'">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>FXSMP | Contas da Staff</title>
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <header class="navbar">
        <img src="FXSMP.png" alt="logo" class="logo">
        <nav class="nav-btns">
            <a href="index.html" class="nav-btn">Home</a>
            <a href="form.html" class="nav-btn">Form</a>
            <a href="disc.html" class="nav-btn">Comunidade</a>
            <a href="Staff.html" class="nav-btn">Staff</a>
        </nav>
    </header>

    <main class="page">
        <section class="card largo">
            <h1>Contas da Staff</h1>
            <p class="sub">Somente a conta primária (com verificação em duas etapas) vê esta página. "Autorizar" libera o e-mail para entrar com código; não existe senha para vazar.</p>
            <h2>Autorizar novo e-mail</h2>
            <form class="novo" id="f">
                <div><label for="email">E-mail</label><input type="text" id="email" inputmode="email" autocomplete="off" autocapitalize="none" spellcheck="false" required></div>
                <div><label for="slug">Usuário público (a-z, 0-9, _ . -)</label><input type="text" id="slug" autocomplete="off" autocapitalize="none" spellcheck="false" required></div>
                <div><label for="nome">Nome no perfil</label><input type="text" id="nome" autocomplete="off" maxlength="40" required></div>
                <button type="submit" class="btn-p" id="criar">Autorizar</button>
            </form>
            <div class="erro" id="erro" role="alert" aria-live="polite"></div>
            <h2>Contas</h2>
            <table class="tab"><thead><tr><th>E-mail</th><th>Usuário</th><th>Nome</th><th>Situação</th><th>Ações</th></tr></thead><tbody id="lista"></tbody></table>
            <a href="painel.html" class="voltar">← Voltar ao painel</a>
        </section>
    </main>
    <script src="js/config.js"></script>
    <script src="vendor/supabase.js"></script>
    <script src="js/supa.js"></script>
    <script src="js/contas.js"></script>
</body>
</html>
